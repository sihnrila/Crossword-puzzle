<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>십자말풀이 게임</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
    <!-- 스플래시 화면 -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">📚</div>
            <h1 class="splash-title">십자말풀이</h1>
            <div class="splash-subtitle">Crossword Puzzle</div>
            <div class="splash-loader">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <!-- 설정 화면 -->
    <div class="settings-screen" id="settingsScreen" style="display: none;">
        <div class="settings-container">
            <h1 class="menu-title">설정</h1>
            <div class="settings-content">
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">🔊</span>
                        <span>효과음</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="soundEffectToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">🎵</span>
                        <span>배경음악</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="bgMusicToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">⏱️</span>
                        <span>타이머</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="timerToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">✓</span>
                        <span>자동 체크</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autocheckToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">⏭️</span>
                        <span>채워진 칸 건너뛰기</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="skipFilledToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">↔️</span>
                        <span>단어 끝 이동</span>
                    </div>
                    <select id="wordEndMoveSelect" class="setting-select">
                        <option value="always">항상</option>
                        <option value="ifcomplete">완료 시만</option>
                        <option value="never">안 함</option>
                    </select>
                </div>

<div class="setting-item">
    <div class="setting-label">
        <span class="setting-icon">➡️</span>
        <span>다음 단서 이동</span>
    </div>
    <select id="clueAdvanceModeSelect" class="setting-select">
        <option value="direction">현재 방향</option>
        <option value="global">전체 번호</option>
    </select>
</div>

                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-icon">📊</span>
                        <span>점수 초기화</span>
                    </div>
                    <button class="btn btn-small" id="resetScoreBtn">초기화</button>
                </div>
            </div>
            <button class="btn btn-back" id="closeSettingsBtn">닫기</button>
        </div>
    </div>

    <!-- 메인 메뉴 화면 -->
    <div class="menu-screen" id="menuScreen" style="display: none;">
        <div class="menu-container">
            <button class="btn-settings" id="settingsBtn">⚙️</button>
            <h1 class="menu-title">십자말풀이 게임</h1>
            <div class="vocab-selection" id="vocabSelection"">
                <h2>어휘 목록 선택</h2>
                <div class="vocab-buttons" style="display: flex; gap: 10px; flex-direction: row;">
                    <button class="vocab-btn" data-vocab="national">
                        <div class="vocab-icon">📚</div>
                        <div class="vocab-name">국립국어원<br>어휘목록</div>
                    </button>
                    <button class="vocab-btn" data-vocab="education">
                        <div class="vocab-icon">🎓</div>
                        <div class="vocab-name">시도교육청<br>정리 어휘</div>
                    </button>
                </div>
            </div>
            
            
        </div>
    </div>

    <!-- 난이도 선택 화면 -->
    <div class="difficulty-screen" id="difficultyScreen" style="display: none;">
        <div class="difficulty-container">
            <h1 class="menu-title">난이도 선택</h1>
            <div class="vocab-info" id="vocabInfo"></div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">
                    <div class="difficulty-icon">🟢</div>
                    <div class="difficulty-name">쉬움</div>
                    <div class="difficulty-desc">초등 저학년</div>
                </button>
                <button class="difficulty-btn" data-difficulty="medium">
                    <div class="difficulty-icon">🟡</div>
                    <div class="difficulty-name">보통</div>
                    <div class="difficulty-desc">초등 고학년</div>
                </button>
                <button class="difficulty-btn" data-difficulty="hard">
                    <div class="difficulty-icon">🔴</div>
                    <div class="difficulty-name">어려움</div>
                    <div class="difficulty-desc">중학생 이상</div>
                </button>
            </div>
            
            <div class="size-selection" style="margin-top: 30px;">
                <h3 style="font-size: 18px; color: #333; margin-bottom: 15px;">격자 크기 선택</h3>
                <div class="size-buttons">
                    <button class="size-btn active" data-size="6">
                        <div class="size-label">6×6</div>
                        <div class="size-desc">작은 격자</div>
                    </button>
                    <button class="size-btn" data-size="8">
                        <div class="size-label">8×8</div>
                        <div class="size-desc">중간 격자</div>
                    </button>
                    <button class="size-btn" data-size="10">
                        <div class="size-label">10×10</div>
                        <div class="size-desc">큰 격자</div>
                    </button>
                </div>
            </div>
            
            <button class="btn btn-back" id="backToMenuBtn">뒤로가기</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div class="game-container" id="gameContainer" style="display: none;">
        <header class="game-header">
            <button class="btn-back-small" id="backToDifficultyBtn">←</button>
            <div class="header-center">
                <div class="level-info">
                    <span class="level-label">단계</span>
                    <span class="level-number" id="levelNumber">1</span>
                </div>
                <div class="timer-info" id="timerInfo" style="display: none;">
                    <span class="timer-label">시간</span>
                    <span class="timer-value" id="timerValue">00:00</span>
                </div>
                <div class="score-info">
                    <span class="score-label">점수</span>
                    <span class="score-value" id="scoreValue">0</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-view-toggle" id="viewToggleBtn" title="Grid/List 전환">📋</button>
                <button class="btn-settings-small" id="settingsBtnGame">⚙️</button>
            </div>
        </header>
        
        <!-- 진행률 표시 바 (주석 처리) -->
        <!--
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-info">
                <span class="progress-text" id="progressText">0 / 0 완료</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        -->

        <div class="game-content">
            <!-- List View (단서 리스트 모드) -->
            <div class="list-view" id="listView" style="display: none;">
                <div class="clues-list-full" id="cluesListFull">
                    <!-- 전체 단서 리스트 -->
                </div>
            </div>

            <!-- Grid View (격자 모드) -->
            <div class="grid-view" id="gridView">
                <div class="clues-section">
                    <div class="clues-list" id="cluesList">
                        <!-- 질문들이 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>

                <div class="grid-section">
                    <!-- Canvas 기반 격자 -->
                    <div class="canvas-container" id="canvasContainer" style="display: none;">
                        <canvas id="crosswordCanvas"></canvas>
                    </div>
                    <!-- HTML 기반 격자 (기존) -->
                    <div class="grid-container" id="gridContainer">
                        <!-- 격자가 여기에 동적으로 생성됩니다 -->
                    </div>
                </div>
            </div>

            <div class="word-selection-section" id="wordSelectionSection" style="display: none;">
                <div class="selected-clue" id="selectedClue"></div>
                <div id="directionHint" class="direction-hint" style="display:none;"></div>

                <div class="word-buttons" id="wordButtons">
                    <!-- 단어 버튼들이 여기에 동적으로 추가됩니다 -->
                </div>
                <div class="selected-word" id="selectedWord"></div>
            </div>
        </div>

        <!-- 가상 키보드 (모바일 입력용) -->
        <div class="virtual-keyboard" id="virtualKeyboard" style="display: none;">
            <div class="keyboard-row">
                <input type="text" id="mobileInput" placeholder="글자를 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>
        </div>

        <div class="game-controls">
            <div class="control-group">
                <button class="btn btn-hint" id="hintBtn" title="힌트 (글자 하나 보기)">💡 힌트</button>
                <button class="btn btn-reveal" id="revealWordBtn" title="현재 단어 공개">🔓 단어 공개</button>
                <button class="btn btn-check-word" id="checkWordBtn" title="현재 단어 확인">✓ 단어 확인</button>
            </div>
            <div class="control-group">
                <button class="btn btn-check-all" id="checkAllBtn" title="전체 확인">✓✓ 전체 확인</button>
                <button class="btn btn-clear" id="clearPuzzleBtn" title="퍼즐 초기화">🗑️ 초기화</button>
                <button class="btn btn-reset" id="resetBtn" title="다시 시작">🔄 다시 시작</button>
            </div>
            <button class="btn btn-next" id="nextBtn" style="display: none;">다음 단계</button>
        </div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <h2 id="modalTitle">축하합니다!</h2>
                <p id="modalMessage"></p>
                <button class="btn btn-primary" id="modalBtn">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
